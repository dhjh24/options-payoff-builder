name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Smoke test server + API
      run: |
        PORT=3199 node server.js & SERVER_PID=$!
        sleep 2
        curl -fsS localhost:3199/api/health
        curl -fsS -X POST localhost:3199/api/payoff \
          -H 'Content-Type: application/json' \
          -d '{"spot":180,"legs":[{"type":"call","side":"long","strike":220,"premium":12.5,"contracts":1}]}' \
          > /dev/null
        kill $SERVER_PID
